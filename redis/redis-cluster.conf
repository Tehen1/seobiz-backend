# ===================================================================
# REDIS CLUSTER CONFIGURATION - SEO SEA VISION PRO
# Configuration cluster pour scalabilité et distribution des données
# ===================================================================

# Port du nœud cluster
port 7000

# Activation du mode cluster
cluster-enabled yes

# Fichier de configuration du cluster (généré automatiquement)
cluster-config-file nodes-7000.conf

# Timeout pour considérer un nœud comme failed (en ms)
cluster-node-timeout 15000

# Seuil de replicas pour le failover automatique
cluster-replica-validity-factor 10

# Migration automatique des replicas
cluster-migration-barrier 1

# Exiger tous les slots pour accepter les requêtes
cluster-require-full-coverage yes

# Répertoires et fichiers
dir /var/lib/redis-cluster
logfile /var/log/redis/cluster-7000.log
pidfile /var/run/redis/redis-cluster-7000.pid

# Configuration mémoire optimisée pour cache
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Éviction proactive pour économiser la mémoire
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence adaptée au cache (optimisée)
save 900 1
save 300 10
save 60 10000

# AOF désactivé pour les performances (données de cache)
appendonly no

# Configuration réseau
bind 0.0.0.0
protected-mode yes
requirepass your-cluster-password
masterauth your-cluster-password

# Performance réseau
tcp-keepalive 300
tcp-backlog 511
timeout 0

# Performance I/O
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes

# Configuration client
maxclients 10000

# Configuration pour conteneurs
# cluster-announce-ip 10.0.0.10
# cluster-announce-port 7000
# cluster-announce-bus-port 17000

# Logs détaillés pour debug (désactiver en prod)
loglevel notice
syslog-enabled no

# Monitoring et métriques
latency-monitor-threshold 100

# Sécurité renforcée
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b8c2d4e5f1a9"

# Limites pour éviter les abus
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Optimisations spécifiques au cache
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Configuration pour Kubernetes/Docker
# replica-announce-ip 10.0.0.10
# replica-announce-port 7000
