# ===================================================================
# REDIS SENTINEL CONFIGURATION - SEO SEA VISION PRO
# Configuration pour haute disponibilité et failover automatique
# ===================================================================

# Port du Sentinel
port 26379

# Répertoire de travail
dir /var/lib/redis-sentinel

# Configuration du master à surveiller
# Syntaxe: sentinel monitor <master-name> <ip> <port> <quorum>
sentinel monitor seo-master 127.0.0.1 6379 2

# Mot de passe pour le master Redis (si configuré)
# sentinel auth-pass seo-master your-redis-password

# Temps d'attente avant de considérer le master comme down (en ms)
sentinel down-after-milliseconds seo-master 30000

# Nombre de replicas à reconfigurer en parallèle pendant le failover
sentinel parallel-syncs seo-master 1

# Timeout du failover (en ms)
sentinel failover-timeout seo-master 180000

# Scripts de notification (optionnel)
# sentinel notification-script seo-master /var/redis/notify.sh
# sentinel client-reconfig-script seo-master /var/redis/reconfig.sh

# Configuration réseau
bind 127.0.0.1 0.0.0.0
protected-mode no

# Logs
logfile /var/log/redis/sentinel.log
loglevel notice

# Sécurité
# requirepass sentinel-password
# sentinel auth-user seo-master redis-user

# Configuration avancée pour la production
sentinel deny-scripts-reconfig yes
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Limite de mémoire (pour éviter l'OOM)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (pour sauvegarder l'état du Sentinel)
save 900 1
save 300 10  
save 60 10000

# Performance
tcp-keepalive 300
timeout 0

# Configuration pour Docker/Kubernetes
# sentinel announce-ip <public-ip>
# sentinel announce-port 26379
