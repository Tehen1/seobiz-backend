global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'redis-master'
    static_configs:
      - targets: ['redis-master:6379']

  - job_name: 'redis-replica-1'
    static_configs:
      - targets: ['redis-replica-1:6379']

  - job_name: 'redis-replica-2'
    static_configs:
      - targets: ['redis-replica-2:6379']
